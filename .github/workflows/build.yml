name: build-and-deploy

on:
  schedule:
    # 00:00 America/Lima (05:00 UTC; Lima = UTC-5 year round). SUNAT's padron
    # does not change daily, but the `check` job costs seconds and aborts if the
    # source has not moved, so running daily is cheap.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the source has not changed'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'build/**'
      - 'config.json'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      base_url: ${{ steps.url.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the public site URL
        id: url
        run: |
          repo="${{ github.event.repository.name }}"
          owner="${{ github.repository_owner }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "base_url=https://$repo" >> "$GITHUB_OUTPUT"
          else
            echo "base_url=https://${owner,,}.github.io/$repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare the source against the published site
        id: decide
        env:
          SITE_BASE_URL: ${{ steps.url.outputs.base_url }}
        run: |
          # A push to web/ or build/ always rebuilds: the pipeline or UI changed.
          force=""
          if [[ "${{ github.event_name }}" == "push" ]]; then force="--force"; fi
          if [[ "${{ inputs.force }}" == "true" ]]; then force="--force"; fi
          python3 build/run.py check --base-url "$SITE_BASE_URL" $force

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build dist/
        run: python3 build/run.py build

      - name: Size budget guard
        run: python3 build/guard.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
